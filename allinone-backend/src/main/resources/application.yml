server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: workflow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 30
      minimum-idle: 5
      initialization-fail-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kathmandu

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Kathmandu

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when-authorized

app:
  frontend-url: ${APP_FRONTEND_URL:https://allinone-rolpa.vercel.app}

  upload:
    dir: uploads
    cleanup-days: 30
    cleanup-cron: "0 0 3 * * ?"

  cors:
    origins: ${CORS_ALLOWED_ORIGINS:https://allinone-rolpa.vercel.app}

  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 31536000000

  rate-limit:
    max-requests: 60
    window-ms: 60000

  auth:
    allowed-emails: ${ALLOWED_EMAILS}
    default-password: ${APP_DEFAULT_PASSWORD}
